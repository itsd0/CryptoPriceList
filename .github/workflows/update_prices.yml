name: Update Crypto Prices

on:
  schedule:
    - cron: "17 * * * *" # hourly; GitHub scheduled runs are best-effort
  workflow_dispatch:

concurrency:
  group: crypto-price-update
  cancel-in-progress: false

jobs:
  update_prices:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

      - name: Update README prices
        run: python update_prices.py

      - name: Commit and push changes
        run: |
          git config --local user.email "${{ github.repository_owner }}@users.noreply.github.com"
          git config --local user.name "${{ github.repository_owner }}"
          git add README.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore(prices): refresh market table [skip ci]"
          git push
